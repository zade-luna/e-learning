services:
  db:
    image: postgres:16
    container_name: e_learning_db
    environment:
      POSTGRES_DB: e_learning_db
      POSTGRES_USER: eduaccess_user
      POSTGRES_PASSWORD: postgresql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduaccess_user -d e_learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
